<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        .contact-card {
            width: min(920px, calc(100% - 32px));
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            overflow: hidden;
            background: white;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(31, 45, 76, 0.12);
        }

        .contact-info {
            padding: 48px 40px;
            color: white;
            background: #315bea;
        }

        .contact-info h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }

        .contact-info p {
            line-height: 1.6;
            opacity: 0.88;
        }

        .details {
            margin-top: 32px;
        }

        .detail {
            margin: 18px 0;
        }

        .detail strong {
            display: block;
            margin-bottom: 4px;
        }

        form {
            padding: 48px 40px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8deea;
            border-radius: 8px;
            font: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #315bea;
            box-shadow: 0 0 0 3px rgba(49, 91, 234, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #315bea;
            font: bold 16px Arial, sans-serif;
            cursor: pointer;
        }

        button:hover {
            background: #244bd2;
        }

        @media (max-width: 700px) {
            .contact-card {
                grid-template-columns: 1fr;
            }

            .contact-info,
            form {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="contact-card">
        <section class="contact-info">
            <h1>Contact Us</h1>
            <p>Have a question or want to work together? Send us a message and we’ll get back to you soon.</p>

            <div class="details">
                <div class="detail">
                    <strong>Email</strong>
                    hello@example.com
                </div>
                <div class="detail">
                    <strong>Phone</strong>
                    +1 (555) 123-4567
                </div>
                <div class="detail">
                    <strong>Address</strong>
                    123 Main Street, City, Country
                </div>
            </div>
        </section>

        <form>
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Your name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>
</body>

</html>
